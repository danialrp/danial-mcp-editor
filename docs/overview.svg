<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1.5; }
    .key { fill: #EEEBFF; stroke: #8B7CF6; stroke-width: 1.5; }
    .t { fill: #1F2328; font-size: 15px; font-weight: 600; }
    .s { fill: #59636E; font-size: 12px; }
    .a { stroke: #8C959F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .l { fill: #59636E; font-size: 11px; }
    #arrow path { fill: #8C959F; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161B22; stroke: #30363D; }
      .key { fill: #231F3D; stroke: #8B7CF6; }
      .t { fill: #E6EDF3; }
      .s, .l { fill: #9198A1; }
      .a { stroke: #6E7681; }
      #arrow path { fill: #6E7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- who drives it -->
  <rect class="box" x="10" y="30" width="160" height="60" rx="10"/>
  <text class="t" x="90" y="56" text-anchor="middle">AI agent</text>
  <text class="s" x="90" y="75" text-anchor="middle">any MCP client</text>
  <rect class="box" x="10" y="130" width="160" height="60" rx="10"/>
  <text class="t" x="90" y="156" text-anchor="middle">You, in the app</text>
  <text class="s" x="90" y="175" text-anchor="middle">timeline · panels · keys</text>

  <!-- tools and commands -->
  <rect class="key" x="230" y="70" width="150" height="80" rx="10"/>
  <text class="t" x="305" y="104" text-anchor="middle">150+ tools</text>
  <text class="s" x="305" y="124" text-anchor="middle">one per capability</text>
  <rect class="box" x="430" y="70" width="170" height="80" rx="10"/>
  <text class="t" x="515" y="100" text-anchor="middle">Commands</text>
  <text class="s" x="515" y="119" text-anchor="middle">journal · undo</text>
  <text class="s" x="515" y="135" text-anchor="middle">crash-safe · replayable</text>

  <!-- engine -->
  <rect class="box" x="650" y="20" width="220" height="56" rx="10"/>
  <text class="t" x="760" y="44" text-anchor="middle">Composition builder</text>
  <text class="s" x="760" y="62" text-anchor="middle">HyperFrames slices · mattes · stills</text>
  <rect class="box" x="650" y="102" width="220" height="56" rx="10"/>
  <text class="t" x="760" y="126" text-anchor="middle">Metal render graph</text>
  <text class="s" x="760" y="144" text-anchor="middle">looks · effects · depth · shadow</text>
  <rect class="box" x="650" y="196" width="100" height="56" rx="10"/>
  <text class="t" x="700" y="229" text-anchor="middle">Player</text>
  <rect class="box" x="770" y="196" width="100" height="56" rx="10"/>
  <text class="t" x="820" y="222" text-anchor="middle">Export</text>
  <text class="s" x="820" y="240" text-anchor="middle">segmented</text>

  <path class="a" d="M170,60 C200,60 205,95 228,100"/>
  <text class="l" x="178" y="50">MCP</text>
  <path class="a" d="M170,160 C200,160 205,125 228,120"/>
  <text class="l" x="176" y="182">clicks, keys</text>
  <path class="a" d="M380,110 L428,110"/>
  <path class="a" d="M600,110 C625,110 625,48 648,48"/>
  <path class="a" d="M760,76 L760,100"/>
  <path class="a" d="M720,158 L705,194"/>
  <path class="a" d="M800,158 L815,194"/>
  <text class="s" x="515" y="190" text-anchor="middle">the same tools behind every button</text>
</svg>
