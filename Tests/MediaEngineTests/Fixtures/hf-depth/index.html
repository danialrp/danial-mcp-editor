<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320, height=240">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 320px; height: 240px; overflow: hidden; background: transparent; }
#root { position: relative; width: 320px; height: 240px; overflow: hidden; }
.clip { position: absolute; inset: 0; }
html.pass-back #front, html.pass-front #back { display: none; }
#wall { position: absolute; inset: 0; background: #FF0000; }
#badge { position: absolute; left: 0; top: 0; width: 40px; height: 40px; background: #0000FF; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="320" data-height="240" data-fps="30">
  <video id="src" class="clip" src="assets/footage.mp4" data-start="0" data-duration="3" data-track-index="0" muted playsinline></video>
  <div id="back" class="clip" data-start="0" data-duration="3" data-track-index="1"><div id="wall"></div></div>
  <div id="front" class="clip" data-start="0" data-duration="3" data-track-index="2"><div id="badge"></div></div>
</div>
<script>
const EDGE = [[1, 2]];
const tl = gsap.timeline({ paused: true });
tl.to("#badge", { x: 0, duration: 3 }, 0);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
